# node-pty has no prebuilt linux-arm64 binary usable here; disable the
# shell/sandbox plugin chain that transitively requires it.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: true
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: true
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  disabled: true
- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'
  disabled: true
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  disabled: true
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  disabled: true
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: true
