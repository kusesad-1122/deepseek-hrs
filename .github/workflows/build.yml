name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore rootfs cache
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/librootfs.so
          key: rootfs-v2-${{ hashFiles('scripts/build-rootfs.sh', 'scripts/cordis.patch.yml', 'scripts/entrypoint.sh') }}

      - name: Build rootfs (qemu arm64 + npm install dsh)
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-rootfs.sh
        timeout-minutes: 60

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-HRS-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish Release (anonymous download)
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: v0.1.${{ github.run_number }}
          name: DeepSeek HRS v0.1.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
